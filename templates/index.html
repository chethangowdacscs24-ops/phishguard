<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PhishGuard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;padding:60px 16px}
 .card{background:#1e293b;padding:32px;border-radius:14px;width:100%;max-width:560px}
 h1{margin:0 0 6px}p.sub{color:#94a3b8;margin:0 0 20px}
 input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;box-sizing:border-box}
 button{margin-top:12px;padding:12px 20px;border:0;border-radius:8px;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer}
 #out{margin-top:20px;padding:16px;border-radius:8px;display:none}
 .safe{background:#14532d}.phish{background:#7f1d1d}
</style></head><body><div class="card">
<h1>🛡️ PhishGuard</h1><p class="sub">Paste a URL to check whether it looks like phishing.</p>
<input id="url" placeholder="http://paypal-verify-account.xyz/login">
<button onclick="check()">Check URL</button>
<div id="out"></div></div>
<script>
async function check(){
  const url=document.getElementById('url').value;
  const out=document.getElementById('out');
  const r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  const d=await r.json();
  out.style.display='block';
  if(d.error){out.className='';out.textContent=d.error;return;}
  out.className=d.verdict==='SAFE'?'safe':'phish';
  out.innerHTML='<b>'+(d.verdict==='SAFE'?'✅ Looks safe':'⚠️ Likely phishing')+'</b><br>Phishing probability: '+(d.phishing_probability*100).toFixed(1)+'%';
}
</script></body></html>
